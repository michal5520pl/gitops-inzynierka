apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        service:
          type: LoadBalancer
          port: 443
        config:
          oidc:
            secret:
              create: false
              name: oidc
            externalSecret:
              name: oidc
              enabled: true
              hasScopes: true
          tlsCertPath: "/headlamp-cert/cert.cer"
          tlsKeyPath: "/headlamp-cert/cert.key"
        volumes:
          - name: "headlamp-cert"
            secret:
              secretName: "headlamp-tls"
              items:
                - key: "tls.crt"
                  path: "cert.cer"
                - key: "tls.key"
                  path: "cert.key"
        volumeMounts:
          - name: "headlamp-cert"
            mountPath: "/headlamp-cert"
        probes:
          scheme: HTTPS
  destination:
    name: "in-cluster"
    namespace: kube-dashboard
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
