apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: praxis
  namespace: praxis
spec:
  destinations:
    - name: in-cluster
      namespace: praxis
  roles:
    - name: praxis-app-admin
      policies:
        - p, proj:praxis:praxis-app-admin, applications, *, praxis/*, allow
        - p, proj:praxis:praxis-app-admin, applicationsets, *, praxis/*, allow
        - p, proj:praxis:praxis-app-admin, repositories, *, praxis/*, allow
        - p, proj:praxis:praxis-app-admin, logs, *, praxis/*, allow
      groups:
        - kubernetes-praxis-admin
