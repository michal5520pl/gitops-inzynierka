---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oidc-praxis-admin
  namespace: praxis
rules:
  - verbs:
      - '*'
    apiGroups:
      - '*'
    resources:
      - '*'
...

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-praxis-admin
  namespace: praxis
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: oidcgroup:kubernetes-praxis-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oidc-praxis-admin
...
